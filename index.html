<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyLog</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css" type="text/css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+U:wght@500&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="container">
    <div class="header">
      <h1>StudyLog</h1>
      <div id="status" class="status-badge">Firebase接続中...</div>
    </div>

    <div class="dashboard-grid">
      
      <!-- 左パネル：タイマー操作 -->
      <div class="panel timer-panel">
        
        <!-- タイマーモード切り替え -->
        <div class="mode-switch">
          <button id="mode-normal" class="mode-btn active">通常タイマー</button>
          <button id="mode-pomo" class="mode-btn">ポモドーロ (25分)</button>
        </div>

        <!-- ポモドーロモード表示バッジ -->
        <div id="pomo-badge" class="pomo-badge">🔥 集中タイム (25分)</div>

        <div class="form-group">
          <label for="subject-select">学習科目を選択</label>
          <select id="subject-select">
            <option value="数学">数学</option>
            <option value="英語">英語</option>
            <option value="国語">国語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
          </select>
        </div>

        <div id="timer-display" class="timer-display">00:00:00</div>

        <div class="buttons">
          <button id="btn-start">スタート</button>
          <button id="btn-pause" disabled>一時停止</button>
          <div class="btn-reset-wrapper">
            <button id="btn-reset">選択科目をリセット</button>
          </div>
        </div>
      </div>

      <!-- 右パネル：目標＆ログ -->
      <div class="panel">
        <div class="target-box">
          <div class="target-header">
            <span class="target-title">🎯 今日の目標達成度</span>
            <select id="target-select" class="target-select">
              <option value="1">目標: 1時間</option>
              <option value="2">目標: 2時間</option>
              <option value="3" selected>目標: 3時間</option>
              <option value="4">目標: 4時間</option>
              <option value="5">目標: 5時間</option>
              <option value="6">目標: 6時間</option>
              <option value="8">目標: 8時間</option>
            </select>
          </div>
          <div class="meter-wrapper">
            <div id="meter-fill" class="meter-fill"></div>
          </div>
          <div class="meter-info">
            <span id="percent-text" class="percent-text">0% 達成</span>
            <span id="time-ratio-text" class="time-ratio-text">00:00 / 03:00</span>
          </div>
        </div>

        <h2 class="panel-title">📊 過去7日間の学習ログ</h2>
        <div id="daily-graph" class="daily-graph"></div>

        <h2 class="panel-title" style="margin-top: 24px;">📚 今日の科目内訳</h2>
        <div id="subject-list" class="subject-grid"></div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Firebase設定情報（ご自身のものに置き換えてください）
    const firebaseConfig = {
  apiKey: "AIzaSyCLAC2giwRusPVX2tjn3vxzKVQ06JeUvGc",
  authDomain: "sample-f3493.firebaseapp.com",
  projectId: "sample-f3493",
  storageBucket: "sample-f3493.firebasestorage.app",
  messagingSenderId: "860621969620",
  appId: "1:860621969620:web:133e89696aebd3c9d34341"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const timerDocRef = doc(db, "timers", "study");

    const timerDisplay = document.getElementById("timer-display");
    const statusText = document.getElementById("status");
    const subjectSelect = document.getElementById("subject-select");
    const targetSelect = document.getElementById("target-select");
    const meterFill = document.getElementById("meter-fill");
    const percentText = document.getElementById("percent-text");
    const timeRatioText = document.getElementById("time-ratio-text");
    const dailyGraphContainer = document.getElementById("daily-graph");
    const subjectListContainer = document.getElementById("subject-list");
    
    const modeNormalBtn = document.getElementById("mode-normal");
    const modePomoBtn = document.getElementById("mode-pomo");
    const pomoBadge = document.getElementById("pomo-badge");
    const btnStart = document.getElementById("btn-start");
    const btnPause = document.getElementById("btn-pause");
    const btnReset = document.getElementById("btn-reset");

    let localInterval = null;
    const defaultSubjects = { "数学": 0, "英語": 0, "国語": 0, "理科": 0, "社会": 0};

    const WORK_SEC = 25 * 60; // 25分
    const BREAK_SEC = 5 * 60;  // 5分

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    let currentData = { 
      isRunning: false, 
      startTime: null, 
      activeSubject: "数学",
      timerMode: "normal", // "normal" または "pomo"
      pomoPhase: "work",   // "work" または "break"
      targetHours: 3,
      dailyLogs: {}
    };

    // 通知音（ビープ音）を鳴らす関数
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime); // A5ノート
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) { console.log(e); }
    }

    function formatTime(totalSeconds) {
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(Math.floor(totalSeconds % 60)).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function formatPomoTime(totalSeconds) {
      const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const secs = String(Math.floor(totalSeconds % 60)).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function getTodaySubjectSeconds(todayKey, subject, isCurrentActive = false) {
      const todayData = (currentData.dailyLogs && currentData.dailyLogs[todayKey]) || {};
      let total = todayData[subject] || 0;

      // 通常モード、またはポモドーロの集中フェーズ時のみ勉強時間として加算
      if (isCurrentActive && currentData.isRunning && currentData.startTime) {
        if (currentData.timerMode === "normal" || currentData.pomoPhase === "work") {
          const elapsed = Math.floor((Date.now() - currentData.startTime) / 1000);
          total += elapsed;
        }
      }
      return total;
    }

    function updateDisplay() {
      const todayKey = getTodayKey();
      const active = currentData.activeSubject;
      const isPomo = (currentData.timerMode === "pomo");

      // UI表示の切り替え
      modeNormalBtn.classList.toggle("active", !isPomo);
      modePomoBtn.classList.toggle("active", isPomo);

      if (isPomo) {
        pomoBadge.style.display = "inline-block";
        const isWork = (currentData.pomoPhase === "work");
        pomoBadge.className = `pomo-badge ${isWork ? 'work' : 'break'}`;
        pomoBadge.textContent = isWork ? "🔥 集中タイム (25分)" : "☕ 休憩タイム (5分)";
        timerDisplay.classList.toggle("break-mode", !isWork);
      } else {
        pomoBadge.style.display = "none";
        timerDisplay.classList.remove("break-mode");
      }

      // タイマー文字の描画
      if (!isPomo) {
        // 通常カウントアップ
        const activeTotal = getTodaySubjectSeconds(todayKey, active, true);
        timerDisplay.textContent = formatTime(activeTotal);
      } else {
        // ポモドーロ カウントダウン
        const targetLimit = (currentData.pomoPhase === "work") ? WORK_SEC : BREAK_SEC;
        let elapsed = 0;
        if (currentData.isRunning && currentData.startTime) {
          elapsed = Math.floor((Date.now() - currentData.startTime) / 1000);
        }
        let remain = targetLimit - elapsed;

        // 0秒到達時の処理（フェーズ自動切り替え）
        if (remain <= 0 && currentData.isRunning) {
          playBeep();
          handlePomoPhaseComplete();
          return;
        }
        timerDisplay.textContent = formatPomoTime(Math.max(0, remain));
      }

      // 今日の合計勉強時間とメーター更新
      const todayLog = (currentData.dailyLogs && currentData.dailyLogs[todayKey]) || {};
      let todayTotalSeconds = 0;
      for (const [subj, sec] of Object.entries(todayLog)) { todayTotalSeconds += sec; }
      if (currentData.isRunning && (currentData.timerMode === "normal" || currentData.pomoPhase === "work")) {
        todayTotalSeconds += Math.floor((Date.now() - currentData.startTime) / 1000);
      }

      const targetHours = currentData.targetHours || 3;
      const percent = Math.min(100, Math.round((todayTotalSeconds / (targetHours * 3600)) * 100));

      meterFill.style.width = `${percent}%`;
      percentText.textContent = `${percent}% 達成 ${percent >= 100 ? '🎉' : ''}`;
      timeRatioText.textContent = `${formatTime(todayTotalSeconds).slice(0, 5)} / ${String(targetHours).padStart(2, '0')}:00`;

      renderGraphAndList(todayKey, getTodaySubjectSeconds(todayKey, active, true));
    }

    // ポモドーロ 25分または5分終了時の自動切り替え処理
    async function handlePomoPhaseComplete() {
      const todayKey = getTodayKey();
      const active = currentData.activeSubject;
      let logs = JSON.parse(JSON.stringify(currentData.dailyLogs || {}));
      if (!logs[todayKey]) logs[todayKey] = {};

      if (currentData.pomoPhase === "work") {
        // 25分集中終了 -> ログに25分(1500秒)を加算して休憩モードへ
        logs[todayKey][active] = (logs[todayKey][active] || 0) + WORK_SEC;
        await setDoc(timerDocRef, {
          ...currentData,
          isRunning: true,
          startTime: Date.now(),
          pomoPhase: "break",
          dailyLogs: logs
        });
      } else {
        // 5分休憩終了 -> 集中モードへ
        await setDoc(timerDocRef, {
          ...currentData,
          isRunning: true,
          startTime: Date.now(),
          pomoPhase: "work"
        });
      }
    }

    function renderGraphAndList(todayKey, currentActiveTime) {
      const logs = currentData.dailyLogs || {};
      const last7Days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        last7Days.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
      }

      const dayTotals = last7Days.map(dateKey => {
        const dayData = logs[dateKey] || {};
        let total = 0;
        for (const [subj, sec] of Object.entries(dayData)) { total += sec; }
        if (dateKey === todayKey && currentData.isRunning && (currentData.timerMode === "normal" || currentData.pomoPhase === "work")) {
          total += Math.floor((Date.now() - currentData.startTime) / 1000);
        }
        return { dateKey, total };
      });

      const maxSeconds = Math.max(3600, ...dayTotals.map(d => d.total));

      dailyGraphContainer.innerHTML = "";
      dayTotals.forEach(({ dateKey, total }) => {
        const row = document.createElement("div");
        row.className = "graph-row";
        const isToday = (dateKey === todayKey);
        const percent = Math.min(100, Math.round((total / maxSeconds) * 100));
        row.innerHTML = `
          <div class="graph-date">${isToday ? "今日" : dateKey.slice(5).replace('-', '/')}</div>
          <div class="graph-bar-wrapper">
            <div class="graph-bar ${isToday ? 'today' : ''}" style="width: ${percent}%;"></div>
          </div>
          <div class="graph-time">${formatTime(total)}</div>
        `;
        dailyGraphContainer.appendChild(row);
      });

      subjectListContainer.innerHTML = "";
      for (const [subj] of Object.entries(defaultSubjects)) {
        const isCurrent = (subj === currentData.activeSubject);
        const sec = getTodaySubjectSeconds(todayKey, subj, isCurrent);
        const item = document.createElement("div");
        item.className = `subject-badge ${isCurrent ? 'active' : ''}`;
        item.innerHTML = `<span>${subj}</span><span>${formatTime(sec)}</span>`;
        subjectListContainer.appendChild(item);
      }
    }

    // Firebase リアルタイム受信
    onSnapshot(timerDocRef, (docSnap) => {
      statusText.textContent = "🟢 同期中";
      if (docSnap.exists()) {
        currentData = docSnap.data();
      } else {
        currentData = { isRunning: false, startTime: null, activeSubject: "数学", timerMode: "normal", pomoPhase: "work", targetHours: 3, dailyLogs: {} };
      }

      if (currentData.activeSubject) subjectSelect.value = currentData.activeSubject;
      if (currentData.targetHours) targetSelect.value = currentData.targetHours;

      btnStart.disabled = currentData.isRunning;
      btnPause.disabled = !currentData.isRunning;

      if (localInterval) clearInterval(localInterval);
      updateDisplay();
      if (currentData.isRunning) {
        localInterval = setInterval(updateDisplay, 1000);
      }
    }, (error) => {
      console.error(error);
      statusText.textContent = "🔴 接続エラー";
    });

    // モード切り替えイベント
    modeNormalBtn.addEventListener("click", async () => {
      if (currentData.timerMode === "normal") return;
      await setDoc(timerDocRef, { ...currentData, isRunning: false, startTime: null, timerMode: "normal" });
    });

    modePomoBtn.addEventListener("click", async () => {
      if (currentData.timerMode === "pomo") return;
      await setDoc(timerDocRef, { ...currentData, isRunning: false, startTime: null, timerMode: "pomo", pomoPhase: "work" });
    });

    // 目標変更
    targetSelect.addEventListener("change", async () => {
      await setDoc(timerDocRef, { ...currentData, targetHours: parseInt(targetSelect.value, 10) });
    });

    // 科目変更
    subjectSelect.addEventListener("change", async () => {
      const todayKey = getTodayKey();
      const newSubject = subjectSelect.value;
      const oldSubject = currentData.activeSubject;
      let logs = JSON.parse(JSON.stringify(currentData.dailyLogs || {}));
      if (!logs[todayKey]) logs[todayKey] = {};

      if (currentData.isRunning && currentData.startTime && (currentData.timerMode === "normal" || currentData.pomoPhase === "work")) {
        const elapsed = Math.floor((Date.now() - currentData.startTime) / 1000);
        logs[todayKey][oldSubject] = (logs[todayKey][oldSubject] || 0) + elapsed;
      }

      await setDoc(timerDocRef, {
        ...currentData,
        activeSubject: newSubject,
        startTime: currentData.isRunning ? Date.now() : null,
        dailyLogs: logs
      });
    });

    // スタート
    btnStart.addEventListener("click", async () => {
      await setDoc(timerDocRef, { ...currentData, isRunning: true, startTime: Date.now() });
    });

    // 一時停止
    btnPause.addEventListener("click", async () => {
      if (!currentData.isRunning) return;
      const todayKey = getTodayKey();
      let logs = JSON.parse(JSON.stringify(currentData.dailyLogs || {}));
      if (!logs[todayKey]) logs[todayKey] = {};

      if (currentData.timerMode === "normal" || currentData.pomoPhase === "work") {
        const elapsed = Math.floor((Date.now() - currentData.startTime) / 1000);
        const active = currentData.activeSubject;
        logs[todayKey][active] = (logs[todayKey][active] || 0) + elapsed;
      }

      await setDoc(timerDocRef, {
        ...currentData,
        isRunning: false,
        startTime: null,
        dailyLogs: logs
      });
    });

    // リセット
    btnReset.addEventListener("click", async () => {
      const todayKey = getTodayKey();
      const active = currentData.activeSubject;
      let logs = JSON.parse(JSON.stringify(currentData.dailyLogs || {}));
      if (!logs[todayKey]) logs[todayKey] = {};
      logs[todayKey][active] = 0;

      await setDoc(timerDocRef, {
        ...currentData,
        isRunning: false,
        startTime: null,
        dailyLogs: logs
      });
    });
  </script>
</body>
</html>
